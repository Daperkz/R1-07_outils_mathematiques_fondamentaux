name: CI/CD

on:
  push:
    branches-ignore:
      - 'no-ga/**'
    tags:
      - 'v*'
  pull_request:
    types: [opened, reopened, synchronize]
    branches-ignore:
      - 'no-ga/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXECUTABLES: ""

jobs:
  check_style_and_lint:
    name: Lint & Syntax Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Dependencies & Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 flake8-github-annotations

      - name: Check Syntax & Fatal Errors (Annotated)
        run: |
          flake8 src/ --format=github --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check Style Warnings (Annotated)
        run: |
          flake8 src/ --format=github --max-line-length=80 --statistics
